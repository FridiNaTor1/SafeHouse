plugins { id 'com.android.application' }

if (providers.gradleProperty('safehouseAppBuildDir').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('safehouseAppBuildDir').get()))
}

// Release signing: the keystore from the environment (CI: the repository's ANDROID_* secrets), else unsigned / debug.
def safehouseKeystore = System.getenv('SAFEHOUSE_ANDROID_KEYSTORE')
// Versions (scripts/android/build-package.py passes them): a release's x.y.z (CI's SAFEHOUSE_VERSION, the tag without
// its "v") is the versionName. Development builds are x.y.<CI run number>-dev (pull requests: safehouseBuildNumber) or
// x.y.0-dev (local builds), x.y from the CMake project version (safehouseBaseVersion). The versionCode is
// x * 10000000 + y * 100000 + z, so it grows with every release and every CI run (releases and pull requests share
// the run numbers): Android installs a newer APK over an older one only when its versionCode is higher. (Until
// 2026-11-17 it was y * 10000 + z and 1 for development builds; every new code is higher than those.)
def safehouseVersion = providers.gradleProperty('safehouseVersion').getOrElse('')
def safehouseBase = providers.gradleProperty('safehouseBaseVersion').getOrElse('0.2')
def safehouseBuildNumber = providers.gradleProperty('safehouseBuildNumber').getOrElse('0')
def safehouseRelease = safehouseVersion ==~ /\d+\.\d+\.\d+/
if (!safehouseRelease && !(safehouseBase ==~ /\d+\.\d+/ && safehouseBuildNumber ==~ /\d+/))
    throw new GradleException("safehouseBaseVersion must be x.y and safehouseBuildNumber a number")
def safehouseVersionName = safehouseRelease ? safehouseVersion : "${safehouseBase}.${safehouseBuildNumber.toInteger()}-dev"
def safehouseVersionParts = (safehouseRelease ? safehouseVersion : "${safehouseBase}.${safehouseBuildNumber}").tokenize('.')*.toInteger()
if (safehouseVersionParts[0] > 200 || safehouseVersionParts[1] > 99 || safehouseVersionParts[2] > 99999)
    throw new GradleException("The version ${safehouseVersionName} does not fit the versionCode (x <= 200, y <= 99, z <= 99999)")
def safehouseVersionCode = safehouseVersionParts[0] * 10000000 + safehouseVersionParts[1] * 100000 + safehouseVersionParts[2]

android {
    namespace 'org.safehouse.android'
    compileSdk 36
    defaultConfig {
        applicationId 'org.safehouse.android'
        minSdk providers.gradleProperty('safehouseMinSdk').getOrElse('21').toInteger()
        targetSdk 36
        versionCode safehouseVersionCode
        versionName safehouseVersionName
    }
    signingConfigs {
        if (safehouseKeystore) {
            safehouse {
                storeFile file(safehouseKeystore)
                storePassword System.getenv('SAFEHOUSE_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SAFEHOUSE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SAFEHOUSE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            // Signed with the SafeHouse release key when SAFEHOUSE_ANDROID_KEYSTORE is set; development APKs use
            // Android's debug key (assembleDebug).
            if (safehouseKeystore) signingConfig signingConfigs.safehouse
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            jniLibs.srcDirs = [providers.gradleProperty('safehouseJniDir').getOrElse('src/main/jniLibs')]
            assets.srcDirs = [providers.gradleProperty('safehouseAssetsDir').getOrElse('src/main/assets')]
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    // Plain JVM tests of the platform-free touch layout (TouchLayoutTest).
    testImplementation 'junit:junit:4.13.2'
}
