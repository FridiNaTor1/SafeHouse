# The macOS packages players download (SafeHouse.app in a .dmg and a .zip): the launcher, Sly 2 (on Metal) and the
# disc tools. The FFmpeg libraries come from scripts/macos/ffmpeg.sh (LGPL, the games' codecs only); SDL2 is built
# from its pinned source by CMake; everything is bundled by scripts/macos/package.py.
#
#   workflow_call       from build.yml (every push to main, pull requests, by hand), with the release version, its
#                       build date and commit; build.yml's release job publishes the packages with the others
#   workflow_dispatch   this workflow alone, by hand (a development build: no version, no update check)
#
# Signing is ad hoc (the packages open with right-click > Open the first time). The workflows use no secrets
# beyond GITHUB_TOKEN.
name: macOS packages

on:
  workflow_call:
    inputs:
      version:
        description: Release version (x.y.z); empty for a development build
        type: string
        default: ''
      build-date:
        description: UTC build time (YYYY-MM-DDTHH:MM:SSZ)
        type: string
        default: ''
      commit:
        description: Short commit hash
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: macOS-arm64 }
          - { os: macos-15-intel, target: macOS-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build tools
        run: brew install ninja nasm

      - name: FFmpeg cache (keyed on the recipe)
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/macos/ffmpeg.sh') }}

      - name: FFmpeg (scripts/macos/ffmpeg.sh)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/macos/ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: Configure
        env:
          SAFEHOUSE_VERSION: ${{ inputs.version }}
          SAFEHOUSE_BUILD_DATE: ${{ inputs.build-date }}
          CANE_GIT_HASH: ${{ inputs.commit }}
        run: >-
          cmake --preset macos-release -DCANE_FFMPEG_ROOT="$RUNNER_TEMP/ffmpeg" -DBUILD_TESTING=ON
          -DSAFEHOUSE_VERSION="$SAFEHOUSE_VERSION" -DSAFEHOUSE_BUILD_DATE="$SAFEHOUSE_BUILD_DATE" -DCANE_GIT_HASH="$CANE_GIT_HASH"

      - name: Build
        run: cmake --build --preset macos-release --parallel 3

      - name: Tests
        run: ctest --test-dir build/macos-release --output-on-failure --timeout 300

      - name: Package (scripts/macos/package.py)
        env:
          CODESIGN_IDENTITY: '-'
          SAFEHOUSE_VERSION: ${{ inputs.version }}
        run: python3 scripts/macos/package.py --build build/macos-release --ffmpeg "$RUNNER_TEMP/ffmpeg"

      - name: The bundled game starts (Metal, offscreen)
        run: |
          dist/SafeHouse.app/Contents/MacOS/Sly2-Release --rumble-selftest
          dist/SafeHouse.app/Contents/MacOS/safehouse --steam-status
          dist/SafeHouse.app/Contents/MacOS/safehouse --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SafeHouse-Launcher-${{ matrix.target }}
          path: |
            dist/SafeHouse-Launcher-${{ matrix.target }}.dmg
            dist/SafeHouse-Launcher-${{ matrix.target }}.dmg.sha256
            dist/SafeHouse-Launcher-${{ matrix.target }}.zip
            dist/SafeHouse-Launcher-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

