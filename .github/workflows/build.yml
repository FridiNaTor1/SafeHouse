# Builds, tests and packages SafeHouse for Linux, Windows and macOS, and publishes every push to main as a release.
#
#   push to main         build + tests + packages, then a GitHub release (marked latest) with every package,
#                        SHA256SUMS and SafeHouse-update.json (the launcher's update check reads it)
#   workflow_dispatch    the same, by hand (a release only when run on main)
#   pull request         build + tests + packages as workflow artifacts; never a release
#
# Releases are published only from FridiNaTor1/SafeHouse (any other repository, a fork or the development
# repository, builds and tests only). Versions are <major>.<minor>.<run number>: <major>.<minor> from the CMake
# project version, the run number of this workflow (monotonic). The tag is v<version>; the release job refuses a
# version that is not newer than the newest existing vX.Y.Z tag (the launchers compare x.y.z numerically: 0.2.95 is
# newer than 0.1.94, 0.2.1 newer than 0.2). Every package carries it: the launcher (safehouse --version, Settings >
# Launcher, the update check; CMakeLists.txt SAFEHOUSE_VERSION / SAFEHOUSE_BUILD_DATE / CANE_GIT_HASH), the Windows
# file properties and the setup's Apps & features entry, the macOS / iOS bundle versions (CFBundleVersion of the
# .ipa: the run number), the Switch / Switch 2 NACP, the Android versionName and versionCode
# (x * 10000000 + y * 100000 + z, android/app/build.gradle). Pull requests build development packages: no version
# (they never check for updates), except that the APK is x.y.<run number>-dev with the run number's versionCode, so
# release and pull request APKs install over each other in run order. The asset names stay the same in every release
# (the download links .../releases/latest/download/<name> and the update manifest rely on them).
#
# The packages are built the way the local packaging builds them: Linux on
# Ubuntu 22.04 (glibc baseline), Release, LTO off, X11 and Wayland in GLFW, the pinned AppImage runtime and
# appimagetool; Windows cross-built with LLVM/MinGW 20260616 (UCRT) and NSIS, then installed and started on a real
# Windows (scripts/windows/smoke.ps1, including an update from a local fake release); macOS from macos.yml; the iOS
# app from ios.yml (artifacts only).
# Downloads are pinned by version and SHA-256; actions by commit. Secrets, each optional: ANDROID_* (the APK's release
# key), APPLE_* (ios.yml), WINDOWS_SIGNING_CERT_BASE64 / WINDOWS_SIGNING_CERT_PASSWORD (Authenticode for the Windows
# programs and the setup, scripts/windows/sign.py; without them the Windows packages are unsigned).
# Windows signing through SignPath (docs/PACKAGING.md), the alternative to the certificate secrets and preferred when
# both are set: the secret SIGNPATH_API_TOKEN plus the repository variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG (optional: SIGNPATH_ARTIFACT_CONFIGURATION_SLUG,
# SIGNPATH_WAIT_SECONDS). Used only for releases (publish); without all four nothing changes.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time, in push order; pull requests cancel their own older runs.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      date: ${{ steps.v.outputs.date }}
      commit: ${{ steps.v.outputs.commit }}
      publish: ${{ steps.v.outputs.publish }}
      build-number: ${{ steps.v.outputs.build-number }}
      signpath: ${{ steps.signpath.outputs.signpath }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false
      - id: v
        env:
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=$(sed -nE 's/^project\(ProjectCane VERSION ([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' CMakeLists.txt)
          [ -n "$base" ] || { echo "no project version in CMakeLists.txt"; exit 1; }
          version="$base.$RUN_NUMBER"
          [ "$EVENT" != pull_request ] || version=""
          publish=false
          if [ "$REPOSITORY" = FridiNaTor1/SafeHouse ] && [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ]; then
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=${version:+v$version}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${SHA:0:8}"
            echo "publish=$publish"
            echo "build-number=$RUN_NUMBER"
          } | tee -a "$GITHUB_OUTPUT"
      # SignPath signs the Windows programs and setups of a release (the windows-sign job) when its token and all three
      # variables are set; otherwise the Windows job packs them as before (the certificate secrets, else unsigned).
      - id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          signpath=false
          if [ "$PUBLISH" = true ] && [ -n "$TOKEN" ] && [ -n "$ORGANIZATION" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            signpath=true
          fi
          echo "signpath=$signpath" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }} (Ubuntu 22.04)
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, appimagetool: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, appimagetool: 04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96 }
    timeout-minutes: 120
    env:
      SAFEHOUSE_VERSION: ${{ needs.version.outputs.version }}
      SAFEHOUSE_BUILD_DATE: ${{ needs.version.outputs.date }}
      CANE_GIT_HASH: ${{ needs.version.outputs.commit }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache file desktop-file-utils libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols nasm glslang-tools
          # (glslang-tools: Sly 2's Vulkan renderer compiles its SPIR-V at build time; without it Sly 2 builds OpenGL-only)
          # SDL2 is built from source (Ubuntu 22.04's is too old for FAudio). Without these headers it builds with no
          # audio drivers (only dummy / disk: "SDL audio failed to initialize") and no udev / HIDAPI controller support.
          # SDL loads each of these libraries at run time, so they add no hard dependency. Same set as the local
          # Ubuntu 22.04 packaging container.
          sudo apt-get install -y libasound2-dev libpulse-dev libsndio-dev libudev-dev libdbus-1-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl-dev libibus-1.0-dev libx11-dev libxext-dev libxfixes-dev libxss-dev
      # The packages' FFmpeg: the games' codecs only (scripts/ffmpeg-minimal.sh), not the distribution's full build and
      # its dozens of codec libraries.
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-minimal-linux-${{ matrix.arch }}-ubuntu-22.04-${{ hashFiles('scripts/ffmpeg-minimal.sh') }}
      - name: FFmpeg (scripts/ffmpeg-minimal.sh)
        run: scripts/ffmpeg-minimal.sh linux "$RUNNER_TEMP/ffmpeg"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.arch }}-
      - name: Configure (as the local Ubuntu 22.04 packaging build, plus the tests)
        run: >-
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCANE_LTO=OFF -DCANE_BUILD_SLY2=ON -DCANE_BUILD_SLY3=ON
          -DBUILD_TESTING=ON -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=ON -DCANE_FFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSAFEHOUSE_VERSION="$SAFEHOUSE_VERSION" -DSAFEHOUSE_BUILD_DATE="$SAFEHOUSE_BUILD_DATE" -DCANE_GIT_HASH="$CANE_GIT_HASH"
      - name: Build
        run: cmake --build build/linux --parallel 4
      - name: Check SDL's audio and controller drivers
        run: |
          set -euo pipefail
          cfg=$(find build/linux/_deps -path '*sdl2-build*' -path '*SDL2/SDL_config.h' -print -quit)
          test -n "$cfg" || { echo "::error::SDL_config.h not found"; exit 1; }
          for d in SDL_AUDIO_DRIVER_ALSA SDL_AUDIO_DRIVER_PULSEAUDIO SDL_JOYSTICK_HIDAPI HAVE_LIBUDEV_H; do
            grep -Eq "^#define $d 1" "$cfg" || { echo "::error::SDL was built without $d ($cfg)"; exit 1; }
          done
      - name: Tests
        run: ctest --test-dir build/linux --output-on-failure --timeout 600
      - name: Package (AppImage and tar.gz)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${{ matrix.arch }}.AppImage -o "$RUNNER_TEMP/appimagetool"
          echo "${{ matrix.appimagetool }}  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          python3 scripts/package.py --build build/linux --output dist --appimagetool "$RUNNER_TEMP/appimagetool"
          dist/SafeHouse-Launcher-Linux-${{ matrix.arch }}/bin/safehouse --version
      # Sly 2's VR (the Steam Frame runs the aarch64 package; SteamVR / Monado / WiVRn on both): the bundled OpenXR loader
      # (cmake/openxr-loader.cmake) must be found by the game through its run path, and the Vulkan renderer built in.
      - name: Check Sly 2's VR path (OpenXR loader, Vulkan renderer)
        run: |
          set -euo pipefail
          d=dist/SafeHouse-Launcher-Linux-${{ matrix.arch }}
          test -f "$d/lib/libopenxr_loader.so.1" || { echo "::error::the package has no OpenXR loader (lib/libopenxr_loader.so.1)"; exit 1; }
          grep -Eq '^SLY2N_GLSLANG:FILEPATH=/' build/linux/CMakeCache.txt || { echo "::error::Sly 2 was built without its Vulkan renderer"; exit 1; }
          out=$("$d/bin/Sly2-Release" --vr-check || true)
          echo "$out"
          # (no runtime on the runner: the loader answers "no-runtime"; "no-loader" means the bundled one was not found)
          echo "$out" | grep -Eq '^vr-check: (no-runtime|no-headset|ready)' || { echo "::error::Sly2-Release did not open the bundled OpenXR loader"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}-release
          path: |
            dist/SafeHouse-Launcher-Linux-${{ matrix.arch }}.tar.gz
            dist/SafeHouse-Launcher-Linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # Cross-built with LLVM/MinGW, the toolchain of the published Windows packages; the games do not build with MSVC.
  windows:
    name: Windows ${{ matrix.arch }} (LLVM/MinGW cross build)
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, toolchain: cmake/mingw-toolchain.cmake, ffmpeg: windows }
          - { arch: arm64, toolchain: cmake/mingw-toolchain-arm64.cmake, ffmpeg: windows-arm64 }
    timeout-minutes: 120
    env:
      SAFEHOUSE_VERSION: ${{ needs.version.outputs.version }}
      SAFEHOUSE_BUILD_DATE: ${{ needs.version.outputs.date }}
      CANE_GIT_HASH: ${{ needs.version.outputs.commit }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build tools (Ninja, NSIS, ccache, osslsigncode)
        run: sudo apt-get update && sudo apt-get install -y ninja-build nsis ccache nasm glslang-tools osslsigncode   # (glslang: Sly 2's Vulkan SPIR-V)
      - name: Code-signing certificate (when the secrets are available and SignPath is not used)
        if: needs.version.outputs.signpath != 'true'
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          set -eu
          if [ -n "$CERT_BASE64" ]; then
            printf '%s' "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/safehouse-signing.pfx"
            echo "SAFEHOUSE_WINDOWS_SIGN_PFX=$RUNNER_TEMP/safehouse-signing.pfx" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the Windows packages are unsigned"
          fi
      - name: LLVM/MinGW cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/llvm-mingw.tar.xz
          key: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
      - name: LLVM/MinGW 20260616 (UCRT)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          [ -f "$archive" ] || curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz -o "$archive"
          echo "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "CANE_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-minimal-${{ matrix.ffmpeg }}-llvm-mingw-20260616-${{ hashFiles('scripts/ffmpeg-minimal.sh') }}
      - name: FFmpeg (scripts/ffmpeg-minimal.sh, cross-built)
        run: scripts/ffmpeg-minimal.sh ${{ matrix.ffmpeg }} "$RUNNER_TEMP/ffmpeg"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.arch }}-
      - name: Configure
        run: >-
          cmake -S . -B build/windows-cross -G Ninja -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} -DCMAKE_BUILD_TYPE=Release
          -DCANE_LTO=OFF -DBUILD_TESTING=OFF -DCANE_BUILD_SLY2=ON -DCANE_BUILD_SLY3=ON -DCANE_FFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSAFEHOUSE_VERSION="$SAFEHOUSE_VERSION" -DSAFEHOUSE_BUILD_DATE="$SAFEHOUSE_BUILD_DATE" -DCANE_GIT_HASH="$CANE_GIT_HASH"
      - name: Build
        run: cmake --build build/windows-cross --parallel 4
      - name: Package (portable zip and offline setup; with SignPath only the package folder)
        env:
          SAFEHOUSE_WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          SIGNPATH: ${{ needs.version.outputs.signpath }}
        run: |
          set -euo pipefail
          if [ "$SIGNPATH" = true ]; then
            # The windows-sign job has the programs signed, then makes the zip and the setup from this folder
            # (scripts/package.py --windows-stage reuse; the setup's version comes from the CMake cache).
            python3 scripts/package.py --build build/windows-cross --output dist --windows --arch ${{ matrix.arch }} --windows-stage only
            mkdir -p signing/build-${{ matrix.arch }}
            mv dist/SafeHouse-Launcher-Windows-${{ matrix.arch }} signing/
            cp build/windows-cross/CMakeCache.txt signing/build-${{ matrix.arch }}/
            package=signing/SafeHouse-Launcher-Windows-${{ matrix.arch }}
          else
            python3 scripts/package.py --build build/windows-cross --output dist --windows --arch ${{ matrix.arch }}
            package=dist/SafeHouse-Launcher-Windows-${{ matrix.arch }}
          fi
          # (Sly 2's VR: the OpenXR loader beside the game, cmake/openxr-loader.cmake)
          test -f "$package/bin/openxr_loader.dll" || { echo "::error::the package has no openxr_loader.dll"; exit 1; }
          if [ -n "${SAFEHOUSE_WINDOWS_SIGN_PFX:-}" ]; then
            osslsigncode verify -in dist/SafeHouse-Launcher-Windows-${{ matrix.arch }}-Setup.exe \
              || echo "::warning::the setup's signature does not verify against the runner's trust store (a self-signed test certificate?)"
          fi
      - name: Remove the signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/safehouse-signing.pfx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.signpath != 'true'
        with:
          name: windows-${{ matrix.arch }}-release
          path: |
            dist/SafeHouse-Launcher-Windows-${{ matrix.arch }}-Portable.zip
            dist/SafeHouse-Launcher-Windows-${{ matrix.arch }}-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.signpath == 'true'
        with:
          name: windows-${{ matrix.arch }}-stage
          path: signing
          if-no-files-found: error
          retention-days: 3

  # SignPath (releases only, when configured; docs/PACKAGING.md): both architectures in two signing requests, each
  # approved by hand in SignPath. First every program of the two package folders; then the zips and the setups are
  # made from the signed folders (the uninstaller inside the setup stays unsigned: NSIS writes it while compiling);
  # then the two setups. The signed packages become the windows-<arch>-release artifacts the release takes.
  windows-sign:
    name: Windows (SignPath signing)
    needs: [version, windows]
    if: needs.version.outputs.signpath == 'true'
    runs-on: ubuntu-22.04
    # (each request waits for its manual approval: SIGNPATH_WAIT_SECONDS, default 3600)
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read   # the SignPath action reads this run's job details and downloads the artifacts it submits
    env:
      WAIT_SECONDS: ${{ vars.SIGNPATH_WAIT_SECONDS || '3600' }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts
            launcher/assets/safehouse.ico
          sparse-checkout-cone-mode: false
      - name: Build tools (NSIS, osslsigncode)
        run: sudo apt-get update && sudo apt-get install -y nsis osslsigncode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*-stage
          path: work
          merge-multiple: true
      - name: The programs to sign
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            package=work/SafeHouse-Launcher-Windows-$arch
            test -f "$package/SafeHouse.exe" || { echo "::error::no $arch package folder"; exit 1; }
            (cd work && find SafeHouse-Launcher-Windows-$arch -type f -iname '*.exe') | while read -r program; do
              mkdir -p "unsigned-programs/$(dirname "$program")"
              cp "work/$program" "unsigned-programs/$program"
            done
          done
          find unsigned-programs -type f | sort
      - id: upload-programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-programs
          path: unsigned-programs
          if-no-files-found: error
          retention-days: 3
      - name: Sign the programs (SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.WAIT_SECONDS }}
          output-artifact-directory: signed-programs
      - name: The signed programs back into the package folders
        run: |
          set -euo pipefail
          (cd unsigned-programs && find . -type f) | while read -r program; do
            test -f "signed-programs/$program" || { echo "::error::SignPath returned no $program"; exit 1; }
            if cmp -s "unsigned-programs/$program" "signed-programs/$program"; then
              echo "::error::$program came back unsigned"; exit 1
            fi
            cp "signed-programs/$program" "work/$program"
            osslsigncode verify -in "work/$program" > /dev/null || echo "::warning::$program: the signature does not verify against the runner's trust store"
          done
      - name: Package (portable zips and offline setups from the signed folders)
        run: |
          set -euo pipefail
          mkdir -p unsigned-setups/setups
          for arch in x86_64 arm64; do
            python3 scripts/package.py --build work/build-$arch --output work --windows --arch $arch --windows-stage reuse
            cp work/SafeHouse-Launcher-Windows-$arch-Setup.exe unsigned-setups/setups/
          done
      - id: upload-setups
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-setups
          path: unsigned-setups
          if-no-files-found: error
          retention-days: 3
      - name: Sign the setups (SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-setups.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.WAIT_SECONDS }}
          output-artifact-directory: signed-setups
      - name: The signed packages
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            setup=SafeHouse-Launcher-Windows-$arch-Setup.exe
            test -f "signed-setups/setups/$setup" || { echo "::error::SignPath returned no $setup"; exit 1; }
            if cmp -s "unsigned-setups/setups/$setup" "signed-setups/setups/$setup"; then
              echo "::error::$setup came back unsigned"; exit 1
            fi
            osslsigncode verify -in "signed-setups/setups/$setup" > /dev/null || echo "::warning::$setup: the signature does not verify against the runner's trust store"
            mkdir -p "release-$arch"
            cp "signed-setups/setups/$setup" "work/SafeHouse-Launcher-Windows-$arch-Portable.zip" "release-$arch/"
          done
          ls -la release-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64-release
          path: release-x86_64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64-release
          path: release-arm64
          if-no-files-found: error

  # The packages built above, installed and started on a real Windows (scripts/windows/smoke.ps1), and updated in
  # place from a local fake release. The runner has no GPU: Mesa's software OpenGL is put beside the launcher for
  # the test only.
  windows-smoke:
    name: Windows (the packages start and update)
    needs: [windows, windows-sign]
    # (after SignPath's signing when a release is signed there, else right after the Windows job)
    if: ${{ !cancelled() && needs.windows.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.windows-sign.result) }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts/windows
            scripts/release-manifest.py
            scripts/test-launcher-update.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x86_64-release
          path: dist
      - name: Mesa (llvmpipe), for the test only
        shell: pwsh
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\mesa.7z" https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          if ((Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') { throw 'Mesa checksum mismatch' }
          7z x "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" 'x64\*' -y | Out-Null
      - name: Install, start, update, uninstall
        shell: pwsh
        run: scripts/windows/smoke.ps1 -Dist dist -Mesa "$env:RUNNER_TEMP\mesa\x64" -Shots "$env:RUNNER_TEMP\smoke" -UpdateTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: windows-smoke-screenshots
          path: ${{ runner.temp }}/smoke/*.png

  # Android (phones, tablets, handhelds) and Meta Quest: one arm64 APK with the launcher and Sly 2 (VR through OpenXR on a
  # headset). scripts/android/build-package.py: the locked dependencies (cached), the native libraries with NDK 29, the
  # Gradle app. Signed with the SafeHouse release key from the repository secrets (ANDROID_*) when they are available;
  # without them (pull requests from forks) a debug-signed APK is built and kept as an artifact only.
  android:
    name: Android / Meta Quest (arm64 APK)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SAFEHOUSE_VERSION: ${{ needs.version.outputs.version }}
      SAFEHOUSE_BUILD_DATE: ${{ needs.version.outputs.date }}
      SAFEHOUSE_BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      CANE_GIT_HASH: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: glslang (Sly 2's Vulkan SPIR-V)
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Android SDK packages (NDK 29, platform 36)
        run: |
          set -eu
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Gradle 9.6.1 (pinned checksum)
        run: |
          set -eu
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/android-deps
          key: android-deps-${{ hashFiles('scripts/android/dependencies.json', 'scripts/android/bootstrap-dependencies.py', 'scripts/android/build-package.py') }}
      - name: Release signing key (when the secrets are available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/safehouse-release.keystore"
            echo "SAFEHOUSE_ANDROID_KEYSTORE=$RUNNER_TEMP/safehouse-release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building the debug APK"
          fi
      - name: Build the APK
        env:
          SAFEHOUSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAFEHOUSE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAFEHOUSE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 scripts/android/build-package.py --sdk "$ANDROID_HOME" --gradle "$RUNNER_TEMP/gradle-9.6.1/bin/gradle"
          --java-home "$JAVA_HOME_21_X64" --parallel 4
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/safehouse-release.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: dist/android/SafeHouse-Android-arm64-v8a*.apk
          if-no-files-found: error

  # Nintendo Switch: SafeHouse.nro (launcher, Sly 1 and Sly 2) with devkitPro's devkitA64 + libnx + deko3d
  # (cmake/devkitA64-libnx.cmake, cmake/Switch.cmake). The image already has switch-dev, switch-ffmpeg, deko3d and uam.
  switch:
    name: Nintendo Switch (devkitPro)
    needs: version
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219
    timeout-minutes: 120
    env:
      SAFEHOUSE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake --preset switch-release -DSAFEHOUSE_VERSION="$SAFEHOUSE_VERSION"
      - name: Build
        run: cmake --build --preset switch-release --parallel 4
      - name: Check the program
        run: |
          set -eu
          nro=build/switch-release/nro/SafeHouse.nro
          test -s "$nro"
          head -c 20 "$nro" | tail -c 4 | grep -q NRO0
          mkdir -p dist && cp "$nro" dist/SafeHouse.nro
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switch-release
          path: dist/SafeHouse.nro
          if-no-files-found: error

  # Nintendo Switch 2: SafeHouse-NX2.nro (the same program, for kaiHEN homebrew) with ouncebrew's toolchain: libounce,
  # drako3d and uam2 in place of libnx, deko3d and uam (cmake/devkitA64-libounce.cmake, the switch2-release preset).
  # devkitPro comes from the Switch job's image; scripts/switch2-toolchain.sh adds the Switch 2 parts at their pinned
  # versions, built once and cached (uam2 is built on the runner: it needs a newer Meson, Rust and libclang).
  switch2:
    name: Nintendo Switch 2 (devkitPro + ouncebrew)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SAFEHOUSE_VERSION: ${{ needs.version.outputs.version }}
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: devkitPro (the Switch job's image, devkitpro/devkita64:20260219)
        run: |
          set -eu
          docker pull -q devkitpro/devkita64:20260219
          id=$(docker create devkitpro/devkita64:20260219)
          # (docker cp refuses the image's pacman keyring symlink, which points outside /opt/devkitpro)
          docker export "$id" | sudo tar -x -C / opt/devkitpro
          docker rm "$id" > /dev/null
          sudo chown -R "$(id -u):$(id -g)" /opt/devkitpro
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
      - name: Switch 2 toolchain cache
        id: switch2-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/switch2-toolchain
          key: switch2-toolchain-devkita64-20260219-${{ hashFiles('scripts/switch2-toolchain.sh') }}
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build tools for uam2 and drakotools (Meson, Rust, bindgen, libclang)
        if: steps.switch2-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get install -y flex bison libclang-dev libzstd-dev zlib1g-dev libexpat1-dev libdrm-dev glslang-tools python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q meson==1.9.1 Mako==1.3.10 PyYAML==6.0.2 packaging==25.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          cargo install --locked bindgen-cli --version 0.73.2
          cargo install --locked cbindgen --version 0.29.0
      - name: Switch 2 toolchain (scripts/switch2-toolchain.sh)
        run: scripts/switch2-toolchain.sh "$RUNNER_TEMP/switch2-toolchain"
      - name: Configure
        run: cmake --preset switch2-release -DSAFEHOUSE_VERSION="$SAFEHOUSE_VERSION"
      - name: Build
        run: cmake --build --preset switch2-release --parallel 4
      - name: Check the program
        run: |
          set -eu
          nro=build/switch2-release/nro/SafeHouse-NX2.nro
          test -s "$nro"
          head -c 20 "$nro" | tail -c 4 | grep -q NRO0
          mkdir -p dist && cp "$nro" dist/SafeHouse-NX2.nro
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switch2-release
          path: dist/SafeHouse-NX2.nro
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build-date: ${{ needs.version.outputs.date }}
      commit: ${{ needs.version.outputs.commit }}

  # iOS / iPadOS (ios.yml): the .ipa (sideloaded; no App Store) and a simulator start. The release attaches the .ipa
  # when this job succeeded and is published without it otherwise.
  ios:
    name: iOS
    needs: version
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      build-date: ${{ needs.version.outputs.date }}
      commit: ${{ needs.version.outputs.commit }}

  release:
    name: Publish the release
    needs: [version, linux, windows, windows-sign, windows-smoke, macos, switch, switch2, android, ios]
    # Only from the public repository's main branch, and only when every package built and the Windows ones started.
    # The iOS .ipa is attached when its job succeeded; its failure does not hold the release back.
    if: >-
      ${{ !cancelled() && github.repository == 'FridiNaTor1/SafeHouse' && needs.version.outputs.publish == 'true'
      && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.windows-smoke.result == 'success'
      && (needs.windows-sign.result == 'success' || (needs.windows-sign.result == 'skipped' && needs.version.outputs.signpath != 'true'))
      && needs.macos.result == 'success' && needs.switch.result == 'success' && needs.switch2.result == 'success'
      && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: SafeHouse-Launcher-macOS-*
          path: release
          merge-multiple: true
      - name: SHA256SUMS, SafeHouse-update.json and the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          DATE: ${{ needs.version.outputs.date }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          set -euo pipefail
          rm -f release/*.sha256
          python3 scripts/release-manifest.py release --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --date "$DATE" \
            --require linux-appimage --require linux-tar --require linux-aarch64-appimage --require linux-aarch64-tar --require windows-portable --require windows-setup \
            --require windows-arm64-portable --require windows-arm64-setup --require macos-arm64 --require macos-x86_64 --require switch-nro --require switch2-nro --require android-apk
          # (the previous release: the newest tag of this scheme, vX.Y.Z)
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)
          # A release must be newer than every earlier one, or installed launchers would never offer it (and Android
          # would refuse its APK): a lower CMake project version or a reset run number stops here. (A re-run of the
          # same workflow run finds its own tag: equal is allowed then.)
          if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
            newest=$(printf '%s\n%s\n' "${previous#v}" "$VERSION" | sort -V | tail -n 1)
            if [ "$newest" != "$VERSION" ]; then
              echo "::error::Version $VERSION is not newer than the latest release $previous"
              exit 1
            fi
          fi
          {
            printf 'SafeHouse %s, built %s from %s.\n\n## Changes\n\n' "$VERSION" "${DATE%%T*}" "$COMMIT"
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' -n 40 "$previous..HEAD"
            else
              git log --no-merges --format='- %s' -n 20
            fi
            cat <<'EOF'

          ## Downloads

          | For | File |
          |---|---|
          | Windows, installer | `SafeHouse-Launcher-Windows-x86_64-Setup.exe` |
          | Windows, portable (unzip and open `SafeHouse.exe`) | `SafeHouse-Launcher-Windows-x86_64-Portable.zip` |
          | Windows on ARM, installer | `SafeHouse-Launcher-Windows-arm64-Setup.exe` |
          | Windows on ARM, portable | `SafeHouse-Launcher-Windows-arm64-Portable.zip` |
          | Linux and Steam Deck, AppImage | `SafeHouse-Launcher-Linux-x86_64.AppImage` |
          | Linux, archive | `SafeHouse-Launcher-Linux-x86_64.tar.gz` |
          | Linux on ARM (Steam Frame), AppImage | `SafeHouse-Launcher-Linux-aarch64.AppImage` |
          | Linux on ARM, archive | `SafeHouse-Launcher-Linux-aarch64.tar.gz` |
          | macOS, Apple silicon | `SafeHouse-Launcher-macOS-arm64.dmg` |
          | macOS, Intel | `SafeHouse-Launcher-macOS-x86_64.dmg` |
          | Nintendo Switch (homebrew, copy to `sdmc:/switch/SafeHouse/`) | `SafeHouse.nro` |
          | Nintendo Switch 2 (kaiHEN homebrew, copy to `sdmc:/switch/SafeHouse/`) | `SafeHouse-NX2.nro` |
          | Android and Meta Quest (preview) | `SafeHouse-Android-arm64-v8a.apk` |
          | iPhone and iPad (sideload with AltStore, SideStore or Sideloadly; in testing) | `SafeHouse-iOS.ipa` |

          The launcher updates itself (Settings > Launcher > Check for updates). SHA-256 checksums are in `SHA256SUMS`.
          On macOS, open the app with right-click > Open the first time. The packages contain no game data.
          EOF
          } > NOTES.md
          cat NOTES.md
          ls -la release
      - name: Publish ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tag of this name on another commit (an older tag scheme) would attach the release to the wrong code.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null && [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG already exists on another commit"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of the same workflow run: replace the assets and the notes.
            gh release upload "$TAG" --clobber release/*
            gh release edit "$TAG" --notes-file NOTES.md --draft=false --latest
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "SafeHouse $VERSION" --notes-file NOTES.md --latest
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets --jq '"\(.tagName): draft \(.isDraft), prerelease \(.isPrerelease), assets: \([.assets[].name] | join(", "))"'
